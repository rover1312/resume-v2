    <script>
      // Resolve theme before first paint (no flash) — light is the default
      try {
        var t = localStorage.getItem('fd-theme')
        if (t !== 'light' && t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      html { background: #24282f; }
      html[data-theme='light'] { background: #e7eaef; }
      body { margin: 0; }
    </style>
